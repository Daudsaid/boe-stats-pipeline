version: 2

models:
  - name: stg_boe__observations
    description: >
      Typed, labelled observations in long format. One row per series per date.
      `value` is cast to double for analytics; raw keeps the exact decimal.
    columns:
      - name: series_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_boe__series')
                field: series_code
      - name: series_name
        data_tests: [not_null]
      - name: observed_on
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [series_code, observed_on]

  - name: stg_boe__series
    description: Series metadata from the pipeline registry.
    columns:
      - name: series_code
        data_tests: [unique, not_null]
      - name: series_name
        data_tests: [unique, not_null]
      - name: frequency
        data_tests:
          - accepted_values:
              arguments:
                values: ["daily", "monthly"]
